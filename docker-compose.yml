services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: taskmanagement-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd" # change this before any real use
    ports:
      - "1433:1433" # exposed to the host too, so you can connect with SSMS/Azure Data Studio if you want
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q ''SELECT 1'' || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskmanagement-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Overrides appsettings.json's connection string. "sqlserver" is the
      # hostname Docker's internal network resolves to the sqlserver service
      # above — not localhost, since these are two separate containers.
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=TaskManagementDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True"
    ports:
      - "8080:8080"
    volumes:
      # Bind-mounts your local source into the container, so edits on your
      # host are visible without a rebuild.
      - ./Task_Management:/src/Task_Management

volumes:
  sqlserver_data:
